# Sign commenting is allowed only at the beginning of the line
Directive = allow_url_fopen
Default   = On
Type      = bool
Comment   = Allows PHP file functions to retrieve data from remote locations over FTP or HTTP. This option is a great security risk, thus do not turn it on without necessity.

Directive = session.cookie_secure
Default	  = Off
Type      = bool
Comment   = session.cookie_secure specifies whether cookies should only be sent over secure connections. Defaults to off.

Directive = display_errors
Default   = On
Type      = bool
Comment   = Determines whether errors should be printed to the screen as part of the output or if they should not be shown to a user.

Directive = error_reporting
Default   = E_ALL & ~E_NOTICE
Range     = ~E_ALL,E_ALL & ~E_NOTICE,E_ALL
Type      = list
Comment   = The error reporting level.

Directive = file_uploads
Default   = On
Type      = bool
Comment   = Allows uploading files over HTTP.

Directive = include_path
Default   = .;/path/to/php/pear
Type      = value
Comment   = The list of directories where scripts look for files (similar to system's PATH variable). To separate directories, use a colon (:) For example: .:/dir/inc:/usr/lib/php

Directive = log_errors
Default   = Off
Type      = bool
Comment   = Tells whether to log errors. By default, errors are logged in the server's error log. Use the error_log directive to specify the path to your own log file.

Directive = magic_quotes_gpc
Default   = On
Type      = bool
Remark    = <5.4.0
Comment   = Sets the magic_quotes state for the GPC (Get, Post and Cookie) operations. When magic_quotes are on, all single-quotes, double quotes, backslashesand  special characters are escaped with the backslash automatically.

Directive = mail.force_extra_parameters
Type      = value
Comment   = Additional parameters for the mail() function used to send mail. For example, to use your custom Sendmail configuration: -C /dir/conf.cf

Directive = max_execution_time
Default   = 30
Type      = value
Comment   = The maximum time in seconds a script is allowed to run before it is terminated.

Directive = max_input_time
Default   = 60
Type      = value
Comment   = The maximum time in seconds a script is allowed to parse input data.

Directive = memory_limit
Default   = 128M
Type      = list
Range     = 64M,128M,192M,256M,368M,512M,756M,1024M,2048M
Comment   = The maximum amount of memory in bytes a script is allowed to allocate. Set the value to -1 to have no memory limit (not recommended). Use shortcuts for byte values: K (kilo), M (mega), and G (giga). For example, 128M

Directive = post_max_size
Default   = 8M
Type      = list
Range     = 2M,4M,8M,16M,32M,64M,128M,512M,1024M
Comment   = The maximum size in bytes of data that can be posted with the POST method. Typically, should be larger than upload_max_filesize and smaller than memory_limit. Use shortcuts for byte values: K (kilo), M (mega), and G (giga). For example, 16M.

Directive = open_basedir
Type      = value
Comment   = The list of directories used to limit the files that can be opened by PHP. If the file is outside the specified directories, PHP scripts will refuse to open it. To separate directories, use a colon. For example: /dir/upload:/usr/tmp

Directive = realpath_turbo.open_basedir
Type      = value
Comment   = Use in place of open_basedir. Contact support for more info.

Directive = register_globals
Default   = Off
Type      = bool
Remark    = <5.4.0
Comment   = Tells whether to register the contents of the EGPCS (Environment, GET, POST, Cookie, Server) variables as global variables. When on, register_globals will inject your scripts with all sorts of variables, like request variables from HTML forms. This option is a great security risk, thus do not turn it on without necessity

Directive = safe_mode
Default   = Off
Type      = bool
Remark    = <5.4.0
Comment   = Enables PHP safe mode. This mode puts a number of restrictions on scripts (say, access to file system) mainly for security reasons.

Directive = safe_mode_exec_dir
Type      = value
Remark    = <5.4.0
Comment   = If PHP is in the safe mode, scripts can execute external programs located only in this directory. For example: /dir/external

Directive = safe_mode_include_dir
Type      = value
Remark    = <5.4.0
Comment   = If PHP is in the safe mode and a script tries to access some files, files from this directory will bypass security (UID/GID) checks. The directory must also be in include_path. For example: /dir/inc

Directive = session.save_path
Default   = /tmp
Type      = value
Comment   = The directory where PHP writes session data (files). For example: /dir/tmp

Directive = short_open_tag
Default   = On
Type      = bool
Comment   = Allows the short form of the PHP open tag.

Directive = upload_max_filesize
Default   = 2M
Type      = list
Range     = 2M,4M,8M,16M,32M,64M,128M,256M,512M,1G,2G
Comment   = The maximum size in bytes of an uploaded file. Use shortcuts for byte values: K (kilo), M (mega), and G (giga). For example, 128M.

Directive = register_long_arrays
Default   = Off
Type      = bool
Comment   = Whether or not to register the old-style input not recommended for performance
Remark    = <5.4.0

Directive = phar.readonly
Default   = On
Type      = bool
Comment   = turn phar read only off or on

Directive = session.use_trans_sid
Default   = Off
Type      = bool
Comment   = trans sid support is disabled by default. Use of trans sid may risk your users security. Use this option with caution.


Directive = session.use_cookies
Default   = On
Type      = bool
Comment   = Whether to use cookies.

Directive = expose_php
Default   = On
Type      = bool
Comment   = Decides whether PHP may expose the fact that it is installed on the server


Directive = max_input_vars
Default   = 1000
Type      = list
Range     = 1000,2048,4096,8192
Comment   = Maximum variables allowed for input. Available since PHP 5.3.9

Directive = mysql.connect_timeout
Default   = 60
Type      = list
Range     = 60,12,140,160,180
Comment   = Maximum time (in seconds) for connect timeout


Directive = max_file_uploads
Default   = 20
Type      = list
Range     = 20,40,60,80,100,200
Comment   = max file uploads at once

Directive = output_buffering
Default   = Off
Type      = bool
Comment   = Output buffering allows you to send header lines (including cookies) evenafter you send body content at the cost of speed.

Directive = allow_url_include
Default   = Off
Type      = bool
Comment   = Enable the ability to include a remote url. This could open up possible security issues.

Directive = suhosin.executor.eval.whitelist
Default   =
Type      = value
Comment = Whitelist commands in suhosin

Directive = suhosin.executor.include.whitelist
Default   =
Type      = value
Comment = Whitelist commands in suhosin


Directive = date.timezone
Default   = UTC
Type      = value
Comment   = The default timezone used by all date/time functions.  A list of supported timezone values can be found here: http://www.php.net/manual/en/timezones.php

Directive = disable_functions
Default   =
Type = value
Comment = Comma separated list of php functions to disable

Directive = sendmail_path
Default   = /usr/sbin/sendmail -t -i
Type     = list
Range    = /usr/sbin/sendmail -t -i,/bin/true
Comment   = Switch to /bin/true to disable php mail

Directive = suhosin.request.max_vars
Default   = 500
Type      = list
Range     = 500,1000,2000,3000,4000,5000,6000
Comment   = suhosin.request.max_vars limit

Directive = suhosin.post.max_vars
Default   = 500
Type      = list
Range     = 500,1000,2000,3000,4000,5000,6000
Comment   = suhosin.post.max_vars limit

Directive = suhosin.executor.disable_eval
Default   = Off
Type      = bool
Comment   = Disable the eval function in php

Directive = suhosin.post.max_array_index_length
Default	  = 64
Type 	  = list
Range     = 64,128,256,512
Comment	  = max_array_index_length

Directive = suhosin.post.max_totalname_length
Default   = 256
Type      = list
Range     = 256,512,1024,65535
Comment   = suhosin.post.max_totalname_length

Directive = suhosin.request.max_array_index_length
Default   = 64
Type      = list
Range     = 64,128,256,512
Comment   = suhosin.request.max_array_index_length

Directive = suhosin.request.max_totalname_length
Default   = 64
Type      = list
Range     = 64,256,512,1024,4048,65535
Comment   = suhosin.request.max_totalname_length

Directive = suhosin.post.max_value_length
Default   = 1000000
Type      = list
Range     = 1000000, 2000000
Comment   = suhosin.post.max_value_length

Directive = suhosin.get.max_value_length
Default   = 1000000
Type      = list
Range     = 1000000, 2000000
Comment   = suhosin.get.max_value_length


Directive = opcache.max_accelerated_files
Default   = 10000
Type	  = list
Range     = 2000, 10000, 40000, 100000
Comment   = The maximum number of keys (and therefore scripts) in the OPcache hash table. Before PHP 7.0.0 the default was 2000/

Directive = opcache.interned_strings_buffer
Default   = 8
Type      = list
Range     = 4,8,16,32,100
Comment   = Before php7 default was 4

Directive = opcache.revalidate_freq
Default   = 2
Type      = list
Range     = 2,4,6,8,30
Comment   = See https://secure.php.net/manual/en/opcache.configuration.php

Directive = opcache.save_comments
Default   = On
Type      = bool
Comment   = See https://secure.php.net/manual/en/opcache.configuration.php

Directive = opcache.file_update_protection
Default   = 2
Type      = list
Range     = 0,2,4,6,8,30
Comment   = Prevents caching files that are less than this number of seconds old. It protects from caching of incompletely updated files. In case all file updates on your site are atomic, you may increase performance by setting it to 0.

Directive = opcache.enable_cli
Default   = Off
Type      = bool
Comment   = Generally leave off. PHP OPcache when running PHP scripts from the command line. OPcache is useful for caching for processes that are reused. CLI exists when done thus opcache will likely waste memory.

Directive = realpath_cache_ttl 
Default   = 120
Type      = list
Range     = 120,300,600
Comment   = Default is recommended

Directive = mysqlnd.collect_statistics
Default   = On
Type      = bool
Comment   = Enables the collection of various client statistics.

Directive = session.gc_maxlifetime
Default	  = 1400
Type      = list
Range     = 1440,3600,7200,14400,28800,86400
Comment   = session.gc_maxlifetime
